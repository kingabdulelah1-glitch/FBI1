function addF(){const c=P[page].c;modal(`<h2>${t("Add")} — ${t(P[page].t)}</h2><form onsubmit="return addS(event)" style="display:flex;flex-direction:column;gap:8px">`+c.map((h,j)=>{const o=sel(h);return o?`<label class="mut">${t(h)}</label><select name="f${j}">${o.map(k=>`<option value="${k}">${k}</option>`).join("")}</select>`:`<input name="f${j}" placeholder="${h}" value="${esc(dv(h))}" ${h=="Submitted By"&&!can("review")?"readonly":""} required>`}).join("")+`<div class="err" id="fe"></div><button class="btn">${t("Save")}</button></form>`)}
function addF0(){const c=P[page].c;modal(`<h2>${t("Add")} — ${t(P[page].t)}</h2><form onsubmit="return addS(event)" style="display:flex;flex-direction:column;gap:8px">`+c.map((h,j)=>`<input name="f${j}" placeholder="${h}" required>`).join("")+`<button class="btn">Save</button></form>`)}
function addS(e){e.preventDefault();const v=[...new FormData(e.target).values()].map(x=>x.trim());if(v.some(x=>!x))return false;if(page!="attendance"&&page!="ann"&&D[page].some(r=>r[0]==v[0])){$("fe").textContent=t("ID already exists.");return false}D[page].push(v);sync(page,D[page][D[page].length-1]);note("Added record in "+P[page].t);$("modal").style.display="none";render();return false}
function addS0(e){e.preventDefault();const v=[...new FormData(e.target).values()].map(x=>x.trim());if(v.some(x=>!x))return false;
D[page].push(v);note("Added record in "+P[page].t);$("modal").style.display="none";render();return false}
function csv(){const t=[P.roster.c,...D.roster].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(t);a.download="roster.csv";a.click()}
const TS="#lc,.grid>.card";
document.addEventListener("mousemove",e=>{const c=e.target.closest&&e.target.closest(TS);if(!c)return;const b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(10px)`});
document.addEventListener("mouseout",e=>{const c=e.target.closest&&e.target.closest(TS);if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
applyL();boot();
